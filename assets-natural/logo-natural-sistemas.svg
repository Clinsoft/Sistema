<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 4 367 152" width="367" height="152" role="img" aria-label="Natural Sistemas">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7D32"/>
      <stop offset="0.55" stop-color="#12A150"/>
      <stop offset="1" stop-color="#7DD35B"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#EAFBEA"/>
      <stop offset="1" stop-color="#B7F5C4"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="word1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B5E20"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="word2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12A150"/>
      <stop offset="1" stop-color="#00B894"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B5A2A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Emblema -->
  <g filter="url(#soft)">
    <rect x="16" y="20" width="120" height="120" rx="30" fill="url(#badge)"/>
  </g>

  <!-- Sol convidativo -->
  <circle cx="108" cy="52" r="16" fill="url(#sun)"/>
  <g stroke="#FFC24A" stroke-width="3.2" stroke-linecap="round">
    <line x1="108" y1="26" x2="108" y2="32"/>
    <line x1="130" y1="52" x2="124" y2="52"/>
    <line x1="124" y1="36" x2="120" y2="40"/>
  </g>

  <!-- Broto: caule + duas folhas -->
  <path d="M76 118 C76 96 76 84 76 68" fill="none" stroke="#EAFBEA" stroke-width="7" stroke-linecap="round"/>
  <path d="M76 92 C58 92 46 80 46 62 C66 62 78 74 76 92 Z" fill="url(#leaf)"/>
  <path d="M76 80 C92 78 104 66 104 50 C86 50 74 62 76 80 Z" fill="url(#leaf)"/>
  <!-- nós (sistema/tecnologia) -->
  <circle cx="76" cy="118" r="4.5" fill="#EAFBEA"/>
  <circle cx="61" cy="76" r="3.2" fill="#EAFBEA"/>
  <circle cx="90" cy="66" r="3.2" fill="#EAFBEA"/>

  <!-- Wordmark -->
  <text x="164" y="80" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="url(#word1)" letter-spacing="-1">Natural</text>
  <text x="164" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="600" fill="url(#word2)" letter-spacing="0.5">Sistemas</text>
</svg>
