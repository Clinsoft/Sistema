<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 0 316 140" width="316" height="140" role="img" aria-label="Natural Sistemas">
  <defs>
    <linearGradient id="folha" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0E7C3E"/>
      <stop offset="0.5" stop-color="#12A150"/>
      <stop offset="1" stop-color="#7ED957"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12351C"/>
      <stop offset="1" stop-color="#1E7A3A"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12A150"/>
      <stop offset="1" stop-color="#00C08B"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B5A2A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Folha (nature) -->
  <g filter="url(#sh)">
    <path d="M60 126 C18 102 22 46 68 10 C104 40 104 98 60 126 Z" fill="url(#folha)"/>
  </g>
  <!-- Brilho suave sobre a folha -->
  <path d="M68 10 C104 40 104 98 60 126 C74 92 78 54 68 10 Z" fill="#ffffff" opacity="0.10"/>

  <!-- Nervuras = circuito -->
  <g fill="none" stroke="#EAFBEA" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 118 C61 86 64 52 69 20"/>
    <path d="M60 96 C50 93 43 90 35 86"/>
    <path d="M62 74 C73 71 80 68 87 63"/>
    <path d="M64 52 C56 50 50 48 43 45"/>
  </g>
  <!-- Nós (sistema) -->
  <circle cx="35" cy="86" r="5.2" fill="#FF9E00"/>
  <circle cx="87" cy="63" r="4.6" fill="#EAFBEA"/>
  <circle cx="43" cy="45" r="4.6" fill="#EAFBEA"/>
  <circle cx="69" cy="18" r="4.4" fill="#FFC24A"/>
  <circle cx="58" cy="118" r="4.8" fill="#EAFBEA"/>

  <!-- Wordmark -->
  <text x="150" y="66" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="url(#w1)" letter-spacing="-1.2">natural</text>
  <text x="150" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="600" fill="url(#w2)" letter-spacing="1">sistemas</text>
</svg>
