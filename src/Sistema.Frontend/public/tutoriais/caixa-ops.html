<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reimprimir cupom / Sangria</title>
<link rel="stylesheet" href="./sim.css">
<style>
  .pdv{position:absolute;inset:0;display:flex;flex-direction:column;background:#f1f5f9}
  .top{height:48px;background:#1f2937;display:flex;align-items:center;gap:8px;padding:0 12px;color:#fff}
  .chip{font-size:11px;background:#16a34a;padding:2px 8px;border-radius:20px;margin-right:auto}
  .tbtn{width:34px;height:34px;border-radius:8px;background:#374151;display:flex;align-items:center;justify-content:center;font-size:15px}
  .body{flex:1;display:flex;align-items:center;justify-content:center;color:#94a3b8}
  .ov{position:absolute;inset:0;background:rgba(15,23,42,.4);display:flex;align-items:center;justify-content:center;z-index:20}
  .dlg{background:#fff;border-radius:16px;padding:18px;width:min(360px,86%);box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .dlg h3{margin:0 0 10px;color:#6d28d9;display:flex;align-items:center;gap:6px}
  .tog{display:flex;gap:8px;margin-bottom:12px}
  .tg{flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:9px;text-align:center;font-weight:600;font-size:13px}
  .tg.on{background:#ede9fe;border-color:#7c3aed;color:#5b21b6}
  .fld{border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:14px;color:#334155;margin-bottom:8px}
  .btn{background:#6d28d9;color:#fff;border-radius:10px;padding:10px;text-align:center;font-weight:700}
  .toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:30}
</style></head>
<body>
<div class="sim-stage"><div class="scene"><div class="pdv">
  <div class="top"><b>PDV</b><span class="chip">● Caixa #12</span>
    <div class="tbtn" id="imprimir" title="Reimprimir">🖨️</div>
    <div class="tbtn" id="caixa" title="Movimentação">🧾</div></div>
  <div class="body">Barra superior do PDV</div>
</div></div></div>
<script src="./sim.js"></script>
<script>
  Sim.run([
    { cap:'Cupom não saiu? Clique na impressora (ou Ctrl+P) para a 2ª via do último cupom.', sel:'#imprimir', act:'click', ms:800 },
    { cap:'A 2ª via é enviada para a impressora.', ms:1400,
      before:()=>document.querySelector('.scene').insertAdjacentHTML('beforeend','<div class="toast" id="toast">🖨️ 2ª via do cupom nº 000123 enviada à impressora.</div>') },
    { cap:'Retirar ou colocar dinheiro no caixa? Clique no 🧾 (ou Ctrl+M).', sel:'#caixa', act:'click', ms:800,
      before:()=>{ const t=document.getElementById('toast'); if(t) t.remove();
        document.querySelector('.scene').insertAdjacentHTML('beforeend',
        '<div class="ov" id="ov"><div class="dlg"><h3>🧾 Movimentação de caixa</h3><div class="tog"><div class="tg on" id="sangria">− Sangria</div><div class="tg" id="reforco">＋ Reforço</div></div><div class="fld" id="valor">R$ 0,00</div><div class="fld">Motivo (ex.: retirada p/ cofre)</div><div class="btn" id="conf">Confirmar</div></div></div>'); } },
    { cap:'Sangria = retirada · Reforço = entrada. Informe o valor.', sel:'#valor', act:'type', text:'', ms:200,
      after:()=>document.getElementById('valor').textContent='R$ 200,00' },
    { cap:'Confirme — o valor é registrado no fechamento do caixa. ✅', sel:'#conf', act:'click', ms:900,
      after:()=>{ document.getElementById('ov').remove();
        document.querySelector('.scene').insertAdjacentHTML('beforeend','<div class="toast">✅ Sangria de R$ 200,00 registrada.</div>'); } },
  ], { badge:'Simulação · Reimprimir / Sangria' });
</script>
</body></html>
