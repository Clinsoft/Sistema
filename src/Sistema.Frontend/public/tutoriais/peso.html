<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venda por peso (balança)</title>
<link rel="stylesheet" href="./sim.css">
<style>
  .pdv{position:absolute;inset:0;display:flex;flex-direction:column;background:#f1f5f9}
  .top{height:52px;background:#1f2937;display:flex;align-items:center;gap:10px;padding:0 14px;color:#fff}
  .chip{font-size:11px;background:#16a34a;padding:2px 8px;border-radius:20px}
  .busca{flex:1;background:#374151;border-radius:8px;height:34px;display:flex;align-items:center;padding:0 12px;color:#cbd5e1;font-size:14px;max-width:440px;margin:0 auto}
  .body{flex:1;padding:14px}
  .col-h{display:flex;font-size:11px;color:#64748b;font-weight:700;text-transform:uppercase;padding:0 8px 6px}
  .col-h .p{flex:1}.col-h .q{width:110px;text-align:center}.col-h .t{width:90px;text-align:right}
  .row{display:flex;align-items:center;background:#fff;border-radius:10px;padding:10px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .row .p{flex:1}.row .nome{font-weight:600;font-size:14px}.row .sub{font-size:11px;color:#94a3b8}
  .row .q{width:110px;text-align:center;font-weight:600}.row .t{width:90px;text-align:right;font-weight:700}
  .vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;gap:6px;height:180px}
  .etq{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:5;background:#fff;border:2px dashed #16a34a;border-radius:10px;padding:8px 12px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .etq .b{font-family:monospace;font-size:16px;letter-spacing:2px;font-weight:700}
  .etq .s{font-size:10px;color:#64748b}
</style></head>
<body>
<div class="sim-stage"><div class="scene"><div class="pdv">
  <div class="top"><b>PDV</b> <span class="chip">● Caixa #12</span>
    <div class="busca" id="busca">Código de barras, SKU ou nome do produto</div></div>
  <div class="body">
    <div class="col-h"><span class="p">Produto</span><span class="q">Quantidade</span><span class="t">Total</span></div>
    <div id="lista"></div>
    <div class="vazio" id="vazio">⚖️<div>Aguardando produto</div></div>
  </div>
</div></div></div>
<script src="./sim.js"></script>
<script>
  Sim.run([
    { cap:'Produtos por kg têm etiqueta da balança (o código começa com 2).', ms:1400,
      before:()=>document.querySelector('.scene').insertAdjacentHTML('beforeend',
        '<div class="etq" id="etq"><div class="b">2 0042 001290 7</div><div class="s">Etiqueta da balança</div></div>') },
    { cap:'Bipe a etiqueta no leitor.', sel:'#busca', act:'click', ms:700 },
    { cap:'O sistema lança o item com o peso e o preço da etiqueta.', ms:1600,
      before:()=>{ const e=document.getElementById('etq'); if(e) e.remove();
        document.getElementById('vazio').classList.add('hidden');
        document.getElementById('lista').innerHTML='<div class="row"><div class="p"><div class="nome">CASTANHA DE CAJU (kg)</div><div class="sub">PLU 0042 · KG · R$ 79,90/kg</div></div><div class="q">0,161 kg</div><div class="t">R$ 12,90</div></div>'; } },
    { cap:'Sem etiqueta? Busque o produto por kg e informe os gramas.', sel:'#busca', act:'type', text:'GRANOLA A GRANEL', ms:900,
      before:()=>document.getElementById('busca').textContent='' },
    { cap:'Depois é só seguir com o pagamento normalmente.', ms:1400,
      before:()=>document.getElementById('busca').textContent='Código de barras, SKU ou nome do produto' },
  ], { badge:'Simulação · Venda por peso (balança)' });
</script>
</body></html>
